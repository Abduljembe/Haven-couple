    <meta property="og:title" content="Haven - Private Couple Space" />
    <meta property="og:description" content="End-to-end encrypted private space for couples with audio and video calls, synchronized watch parties, and private notes." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
    <script>
      // Gracefully handle benign Vite websocket and HMR reconnection in AI Studio sandbox
      (function() {
        if (typeof window === 'undefined') return;

        var isBenignVite = function(item) {
          if (!item) return false;
          var str = '';
          if (typeof item === 'string') str = item;
          else if (item instanceof Error) str = (item.message || '') + ' ' + (item.stack || '');
          else {
            try { str = String(item); } catch(e) { str = ''; }
          }
          return str.indexOf('[vite]') !== -1 ||
                 str.indexOf('failed to connect to websocket') !== -1 ||
                 str.indexOf('WebSocket connection to') !== -1 ||
                 str.indexOf('vite-hmr') !== -1 ||
                 str.indexOf('vite-ping') !== -1;
        };

        var origError = console.error;
        var origWarn = console.warn;
        var origLog = console.log;

        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isBenignVite(arguments[i])) return;
          }
          origError.apply(console, arguments);
        };

        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isBenignVite(arguments[i])) return;
          }
          origWarn.apply(console, arguments);
        };

        console.log = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (isBenignVite(arguments[i])) return;
          }
          origLog.apply(console, arguments);
        };

        window.addEventListener('error', function(event) {
          if (isBenignVite(event.message) || isBenignVite(event.error)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (isBenignVite(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Intercept Vite HMR internal websocket attempts to avoid browser console network error
        if (window.WebSocket) {
          var NativeWS = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isVite = false;
            if (protocols === 'vite-hmr' || protocols === 'vite-ping') isVite = true;
            if (Array.isArray(protocols) && (protocols.indexOf('vite-hmr') !== -1 || protocols.indexOf('vite-ping') !== -1)) isVite = true;
            if (typeof url === 'string' && (url.indexOf('token=') !== -1 || url.indexOf('/@vite') !== -1)) isVite = true;

            if (isVite) {
              var listeners = {};
              var mockWs = {
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                readyState: 1,
                protocol: typeof protocols === 'string' ? protocols : 'vite-hmr',
                url: String(url),
                bufferedAmount: 0,
                extensions: '',
                binaryType: 'blob',
                send: function() {},
                close: function() {
                  mockWs.readyState = 3;
                  mockWs.dispatchEvent(new Event('close'));
                },
                addEventListener: function(type, fn) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(fn);
                },
                removeEventListener: function(type, fn) {
                  if (!listeners[type]) return;
                  listeners[type] = listeners[type].filter(function(l) { return l !== fn; });
                },
                dispatchEvent: function(event) {
                  var list = listeners[event.type] || [];
                  for (var i = 0; i < list.length; i++) {
                    try { list[i].call(mockWs, event); } catch(e) {}
                  }
                  if (typeof mockWs['on' + event.type] === 'function') {
                    try { mockWs['on' + event.type].call(mockWs, event); } catch(e) {}
                  }
                  return true;
                }
              };
              setTimeout(function() {
                mockWs.dispatchEvent(new Event('open'));
              }, 0);
              return mockWs;
            }
            return new NativeWS(url, protocols);
          };
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
          window.WebSocket.prototype = NativeWS.prototype;
        }
      })();
    </script>
  </head>
  <body class="bg-rose-50/30 text-slate-900 antialiased selection:bg-rose-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
