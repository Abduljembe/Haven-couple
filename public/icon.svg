<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Subtle Border / Frame -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="url(#ringGrad)" stroke-width="4" />

  <!-- Glow effect -->
  <circle cx="256" cy="256" r="140" fill="#f43f5e" opacity="0.15" filter="url(#glow)" />

  <!-- Heart Shape -->
  <path d="M256 160 C220 100 140 110 140 180 C140 245 220 310 256 360 C292 310 372 245 372 180 C372 110 292 100 256 160 Z" fill="url(#heartGrad)" filter="url(#glow)" />

  <!-- Core Sparkle / Connection Nodes -->
  <circle cx="256" cy="220" r="14" fill="#ffffff" opacity="0.95" />
  <circle cx="206" cy="180" r="8" fill="#ffffff" opacity="0.8" />
  <circle cx="306" cy="180" r="8" fill="#ffffff" opacity="0.8" />
</svg>
