<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>

  <!-- Full-bleed background for maskable safe-zone -->
  <rect width="512" height="512" fill="url(#bgGrad)" />

  <!-- Heart scaled inside 80% safe zone -->
  <g transform="translate(64, 64) scale(0.75)">
    <path d="M256 160 C220 100 140 110 140 180 C140 245 220 310 256 360 C292 310 372 245 372 180 C372 110 292 100 256 160 Z" fill="url(#heartGrad)" />
    <circle cx="256" cy="220" r="14" fill="#ffffff" opacity="0.95" />
    <circle cx="206" cy="180" r="8" fill="#ffffff" opacity="0.8" />
    <circle cx="306" cy="180" r="8" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
